name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      # Real secrets used in staging/production; fallback to dummy values for Stage 0.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost/db' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_dummy_secret_that_is_32_chars_long_x' }}
      ENVIRONMENT: staging
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install -r requirements-ci.txt
      - name: Lint with flake8
        run: |
          cd backend
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run lint
        run: |
          cd frontend
          npm run lint
      - name: Run tests
        run: |
          cd frontend
          echo "Frontend tests not configured in Stage 0 - skipping"

  deploy-frontend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel configuration
        id: vercel_config
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Vercel deployment; missing: ${missing[*]}"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node for deploy
        if: steps.vercel_config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Deploy to Vercel
        if: steps.vercel_config.outputs.configured == 'true'
        working-directory: frontend
        run: npx --yes vercel@latest --token "$VERCEL_TOKEN" --prod --yes
