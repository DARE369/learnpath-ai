name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      # Real secrets used in staging/production; fallback to dummy values for Stage 0.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost/db' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_dummy_secret_that_is_32_chars_long_x' }}
      ENVIRONMENT: staging
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install -r requirements-ci.txt
      - name: Lint with flake8
        run: |
          cd backend
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests
        run: |
          cd backend
          python -m pytest tests/ -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      - name: Run lint
        run: |
          cd frontend
          npm run lint
      - name: Run tests
        run: |
          cd frontend
          echo "Frontend tests not configured in Stage 0 - skipping"

  # Vercel deploys frontend automatically via its GitHub integration on push to main.
  # Railway deploys backend automatically via its GitHub integration on push to main.
  # No CI deploy job needed — each platform handles its own deploys.
